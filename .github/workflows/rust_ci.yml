name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload built UI (embedded into the firmware)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  flash-core-tests:
    name: flash-core host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests on the host
        # rust-toolchain.toml pins the Xtensa `esp` toolchain, which this job doesn't install.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: >
          cargo test -p flash-core
          --target x86_64-unknown-linux-gnu
          --config 'build.rustflags=[]'
          --config 'unstable.build-std=[]'

  rust-checks:
    name: Rust Checks
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check
          - command: clippy
            args: --all-features --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download built UI
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: false
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
